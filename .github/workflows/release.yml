name: Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to release (comma-separated, e.g. @myorg/cli,@myorg/generator)"
        required: false
        type: string
  push:
    # paths:
    #   - "**/CHANGELOG.md"
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: Publishers

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm 10.22.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm i

      - name: Sanity check auth tokens
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM token missing (NODE_AUTH_TOKEN)" && exit 1
          fi
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GitHub token missing (GITHUB_TOKEN)" && exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Selective Package Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.packages }}
        run: |
          IFS=',' read -ra PACKAGES <<< "${{ inputs.packages }}"
          for PACKAGE in "${PACKAGES[@]}"; do
            pnpm changeset publish --filter="$PACKAGE"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
